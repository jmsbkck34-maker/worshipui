# Publishes a GitHub Release with the Windows installer and the macOS app when a version tag (v1.2.3) is pushed.
# Share https://github.com/<owner>/<repo>/releases/latest — anyone can download without a GitHub account.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Add Google sign-in settings (from the GOOGLE_CLIENT_JSON secret, if set)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf "%s" "$GOOGLE_CLIENT_JSON" > desktop/google-client.json; fi
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Add Google sign-in settings (from the GOOGLE_CLIENT_JSON secret, if set)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf "%s" "$GOOGLE_CLIENT_JSON" > desktop/google-client.json; fi
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: WorshipUI ${{ github.ref_name }}
          files: dist/*
          body: |
            **Windows:** download `WorshipUI-Setup-*.exe` and run it. If Windows says it protected your PC, choose **More info → Run anyway**.

            **Mac:** download `WorshipUI-*-mac.dmg`, open it and drag WorshipUI to Applications. The first time, open it, choose **Done**, then go to **System Settings → Privacy & Security → Open Anyway**. If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/WorshipUI.app` in Terminal.

            The installers are not signed with a paid certificate, which is why the one-time approval is needed.
