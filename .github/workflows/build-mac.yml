# Builds the macOS installer (universal: Intel and Apple Silicon) on a GitHub-hosted Mac.
# The app is ad-hoc signed (no Apple Developer account), so each Mac approves it once:
# System Settings → Privacy & Security → Open Anyway. Download the .dmg from the run's "Artifacts".
name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: ['work/**', 'main']
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Add Google sign-in settings (from the GOOGLE_CLIENT_JSON secret, if set)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf "%s" "$GOOGLE_CLIENT_JSON" > desktop/google-client.json; fi
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: WorshipUI-mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
